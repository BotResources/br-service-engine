name: release-tags

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (the version the workspace declares)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  detect:
    name: Detect the release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      refused: ${{ steps.detect.outputs.refused }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-detect.sh

  release-line-law:
    name: Release-line law
    needs: detect
    if: needs.detect.outputs.refused != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Report refused versions
        env:
          REFUSED: ${{ needs.detect.outputs.refused }}
        run: |
          set -euo pipefail
          python3 -c '
          import json, os
          for entry in json.loads(os.environ["REFUSED"]):
              print("::error::" + entry)
          '
          exit 1

  release:
    name: Release ${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      VERSION: ${{ matrix.version }}
      LINE: ${{ matrix.line }}
      COMMIT: ${{ matrix.commit }}
      BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-public-api

      - name: Resolve the release tag
        run: |
          set -euo pipefail
          source .github/scripts/library-meta.sh
          echo "RELEASE_TAG=$(release_tag "$VERSION")" >>"$GITHUB_ENV"

      - name: Verify the changelog entry
        run: bash .github/scripts/check-changelog.sh "$COMMIT"

      - name: Registry gate
        id: gate
        run: bash .github/scripts/registry-gate.sh "$VERSION" "$RELEASE_TAG"
        env:
          GATE_REV: ${{ matrix.commit }}

      - name: Compute API listing, API diff and dependencies
        if: steps.gate.outputs.implemented != 'true'
        env:
          BASELINE_TAG: ${{ steps.gate.outputs.baseline_tag }}
        run: bash .github/scripts/registry-prepare.sh "$VERSION" "$COMMIT" "$BASELINE_TAG"

      - name: Tag and release
        if: steps.gate.outputs.implemented != 'true'
        run: bash .github/scripts/release-library.sh "$VERSION" "refs/heads/$LINE" "$COMMIT"

      - name: Record in the registry
        if: steps.gate.outputs.implemented != 'true'
        env:
          BASELINE_TAG: ${{ steps.gate.outputs.baseline_tag }}
        run: bash .github/scripts/registry-record.sh "$VERSION" "$RELEASE_TAG" "$COMMIT" "$BASELINE_TAG"
