name: ci

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: rustfmt --check on the slice modules compose_service! declares
        run: rustfmt --edition 2024 --check crates/example-service/src/slices/*/mod.rs
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --exclude conformance-service-engine --exclude example-service --all-targets --locked
      - name: cargo test (service-engine test-support targets)
        run: cargo test -p service-engine --all-targets --features test-support --locked
      - name: released engine migrations are unchanged or their checksums registered
        run: bash .github/scripts/check-released-migrations.sh

  msrv:
    name: MSRV 1.89 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: msrv
      - run: cargo build --workspace --locked

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  unused-deps:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete
      - run: cargo machete

  removability:
    name: example-service slices are removable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: removability
      - name: build the kernel with every slice removed, then each slice removed in turn
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          all="board card ledger reply roster"
          cargo build -p example-service --no-default-features --lib --locked
          for removed in $all; do
            feats=$(echo "$all" | tr ' ' '\n' | grep -v "^${removed}$" | paste -sd, -)
            echo "::group::without ${removed} (features: ${feats})"
            cargo build -p example-service --no-default-features --features "${feats}" --lib --locked
            echo "::endgroup::"
          done

  semver:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: semver
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks (unified baseline)
        run: |
          set -euo pipefail
          current=$(bash .github/scripts/library-version.sh)
          baseline=$(bash .github/scripts/release-tags.sh "$current" | tail -n1)
          if [ -z "$baseline" ]; then
            echo "::notice::no prior release tag, skipping semver-checks (first lockstep release)"
            exit 0
          fi
          baseline_version="${baseline##*/}"
          baseline_version="${baseline_version#v}"
          IFS=. read -r base_major base_minor _ <<<"${baseline_version}"
          IFS=. read -r cur_major cur_minor _ <<<"${current}"
          breaking=0
          if [ "$cur_major" != "$base_major" ] || { [ "$cur_major" = 0 ] && [ "$cur_minor" != "$base_minor" ]; }; then
            breaking=1
            echo "::notice::${baseline} -> v${current} is a breaking bump: the gate runs no check, so each crate also lists its breaks (report-only); every one needs its CHANGELOG adopter-migration line"
          fi
          shopt -s nullglob
          base_wt="$(mktemp -d)/baseline"
          git worktree add --detach "$base_wt" "$baseline"
          trap 'git worktree remove --force "$base_wt" 2>/dev/null || true; git worktree prune' EXIT
          rustdoc_json() {
            local dir="$1" crate="$2" out="$3"
            ( cd "$dir" && RUSTC_BOOTSTRAP=1 \
              RUSTDOCFLAGS="-Z unstable-options --output-format json --cap-lints allow" \
              cargo doc -p "$crate" --lib --no-deps --all-features --locked \
              --target-dir "$out" )
          }
          fail=0
          for toml in crates/*/Cargo.toml; do
            crate=$(basename "$(dirname "$toml")")
            case "${crate}" in
              conformance-*)
                echo "::notice::${crate} is a conformance battery (executable spec); its assert-helper API tracks the engine contract and renames with it, so it is exempt from semver-checks — service-engine stays gated"
                continue
                ;;
            esac
            if [ ! -f "crates/${crate}/src/lib.rs" ]; then
              echo "::notice::${crate} has no library target, skipping semver-checks"
              continue
            fi
            if ! git cat-file -e "${baseline}:crates/${crate}/Cargo.toml" 2>/dev/null; then
              echo "::notice::${crate} is new since ${baseline}, no baseline to compare, skipping semver-checks"
              continue
            fi
            echo "::group::${crate} vs ${baseline}"
            lib="${crate//-/_}"
            rustdoc_json "." "${crate}" "$PWD/target/semver-current"
            rustdoc_json "$base_wt" "${crate}" "$base_wt/target/semver-baseline"
            if ! cargo semver-checks -p "${crate}" \
              --baseline-rustdoc "$base_wt/target/semver-baseline/doc/${lib}.json" \
              --current-rustdoc "$PWD/target/semver-current/doc/${lib}.json"; then
              fail=1
            fi
            if [ "$breaking" = 1 ]; then
              echo "breaks ${crate} carries since ${baseline} (listed as if v${current} were a minor bump, report-only):"
              cargo semver-checks -p "${crate}" --release-type minor \
                --baseline-rustdoc "$base_wt/target/semver-baseline/doc/${lib}.json" \
                --current-rustdoc "$PWD/target/semver-current/doc/${lib}.json" || true
            fi
            echo "::endgroup::"
          done
          exit $fail

  changelog:
    name: changelog entry per Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check changelog entry
        run: bash .github/scripts/check-changelog.sh
      - name: check README tag pins are fresh
        run: bash .github/scripts/check-readme-pins.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck .github/scripts
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck --severity=warning .github/scripts/*.sh

  release-tooling:
    name: release-line law and registry wiring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release-line decision table
        run: bash .github/scripts/test-release-line.sh
      - name: release detection and registry wiring
        run: bash .github/scripts/test-release-pipeline.sh
      - name: registry gate, tag and record wiring
        run: bash .github/scripts/test-registry-wiring.sh

  registry-gate:
    name: registry gate
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: release-line law and registry gate when the version is bumped
        env:
          BASE_REF: ${{ github.base_ref }}
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: bash .github/scripts/pr-registry-gate.sh

  chart:
    name: helm library chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: helm lint the library chart
        run: helm lint charts/br-service-engine-chart
      - name: helm dependency build the fixture
        run: helm dependency build charts/br-service-engine-chart/ci/thin-example
      - name: helm lint the fixture
        run: helm lint charts/br-service-engine-chart/ci/thin-example
      - name: helm template the fixture and assert the ops contract
        run: |
          set -euo pipefail
          rendered=$(helm template thin-example charts/br-service-engine-chart/ci/thin-example)
          echo "$rendered"
          assert() {
            if ! grep -qE "$1" <<<"$rendered"; then
              echo "::error::rendered fixture is missing the ops-contract marker: $1"
              exit 1
            fi
          }
          assert '^kind: Deployment$'
          assert '^ *- name: migrate$'
          assert '^ *args: \["migrate"\]$'
          assert '^ *- name: serve$'
          assert '^ *args: \["serve"\]$'
          assert '^ *type: Recreate$'
          assert '^ *path: /readyz$'
          assert '^ *path: /livez$'
      - name: helm template the fixture and assert the required port
        run: bash .github/scripts/check-chart-port.sh
      - name: helm template the fixture and assert the secure defaults
        run: |
          set -euo pipefail
          rendered=$(helm template thin-example charts/br-service-engine-chart/ci/thin-example)
          assert() {
            if ! grep -qE "$1" <<<"$rendered"; then
              echo "::error::default render is missing: $1"
              exit 1
            fi
          }
          refute() {
            if grep -qE "$1" <<<"$rendered"; then
              echo "::error::default render must not contain: $1"
              exit 1
            fi
          }
          count() {
            local found
            found=$(grep -cE "$1" <<<"$rendered" || true)
            if [ "$found" -ne "$2" ]; then
              echo "::error::default render has ${found} × '$1', expected $2"
              exit 1
            fi
          }
          assert '^ *runAsNonRoot: true$'
          assert '^ *runAsUser: 65532$'
          assert '^ *runAsGroup: 65532$'
          assert '^ *type: RuntimeDefault$'
          assert '^ *automountServiceAccountToken: false$'
          count '^ *readOnlyRootFilesystem: true$' 2
          count '^ *allowPrivilegeEscalation: false$' 2
          count '^ *- ALL$' 2
          count '^ *startupProbe:$' 1
          refute 'imagePullSecrets'
          refute '^ *annotations:'
          refute '^ *volumes:'
          refute '^ *nodeSelector:'
          refute '^ *tolerations:'
          refute '^ *affinity:'
      - name: helm template the fixture with every neutral field set
        run: |
          set -euo pipefail
          fixture=charts/br-service-engine-chart/ci/thin-example
          rendered=$(helm template thin-example "$fixture" -f "$fixture/values-all-fields.yaml")
          echo "$rendered"
          assert() {
            if ! grep -qE "$1" <<<"$rendered"; then
              echo "::error::all-fields render is missing: $1"
              exit 1
            fi
          }
          assert '^ *example.com/reload: catalog-postgres$'
          assert '^ *example.com/scrape: "true"$'
          assert '^ *example.com/team: catalog$'
          assert '^ *example.com/role: api$'
          assert '^ *example.com/owner: catalog$'
          assert '^ *- name: registry-credentials$'
          assert '^ *automountServiceAccountToken: true$'
          assert '^ *runAsUser: 10001$'
          assert '^ *runAsNonRoot: true$'
          assert '^ *readOnlyRootFilesystem: false$'
          assert '^ *failureThreshold: 60$'
          assert '^ *timeoutSeconds: 3$'
          assert '^ *cpu: 50m$'
          assert '^ *kubernetes.io/arch: arm64$'
          assert '^ *key: example.com/dedicated$'
          assert '^ *nodeAffinity:$'
          assert '^ *- mountPath: /scratch$'
          assert '^ *sizeLimit: 64Mi$'
          assert '^ *- name: S3_PUBLIC_ENDPOINT$'
          assert '^ *value: "https://files.example.com"$'
          if helm template thin-example "$fixture" --set 'podLabels.app\.kubernetes\.io/name=x' >/dev/null 2>&1; then
            echo "::error::a podLabels entry replaced a library selector label without failing the render"
            exit 1
          fi
          if helm template thin-example "$fixture" --set probes.liveness.httpGet.path=/x >/dev/null 2>&1; then
            echo "::error::probes accepted a path override; the probe paths are ops contract v1"
            exit 1
          fi
      - name: chart version bump guard
        run: bash .github/scripts/check-chart-version.sh

  trufflehog:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown

  conformance:
    name: conformance-service-engine (real infra)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free runner disk (one debug binary per scenario fills it, then MinIO answers 507 to the blob scenarios; the removed toolchains are unused here)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: conformance
      - name: tune the ephemeral CI Postgres for the 2-core runner
        run: bash .github/scripts/tune-ci-postgres.sh
      - name: install nats-server
        env:
          NATS_SERVER_VERSION: v2.14.1
        run: |
          set -euo pipefail
          url="https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: cache the MinIO fixture build (keyed on MINIO_COMMIT, valid until the pin moves)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: minio-${{ runner.os }}-01ce918d8279a20e4706b96a64396146894adee4
      - name: build pinned MinIO fixture from source (upstream publishes no binary archive)
        env:
          MINIO_COMMIT: 01ce918d8279a20e4706b96a64396146894adee4
        run: |
          set -euo pipefail
          GOBIN=/tmp/minio-bin go install "github.com/minio/minio@${MINIO_COMMIT}"
          sudo install /tmp/minio-bin/minio /usr/local/bin/minio
          minio --version
      - name: conformance battery
        run: cargo test -p conformance-service-engine --all-targets --locked
      - name: example service e2e
        run: |
          df -h /
          cargo test -p example-service --all-targets --locked -- --test-threads=3

  musl-boot:
    name: musl boot (verify past pest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: musl-boot
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: tune the ephemeral CI Postgres for the 2-core runner
        run: bash .github/scripts/tune-ci-postgres.sh
      - name: install nats-server
        env:
          NATS_SERVER_VERSION: v2.14.1
        run: |
          set -euo pipefail
          url="https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: boot a static musl example-service on pest >= 2.9.3
        run: bash .github/scripts/musl-boot-verify.sh

  conformance-blackbox:
    name: conformance-service-engine black-box (real binary)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: blackbox
      - name: tune the ephemeral CI Postgres for the 2-core runner
        run: bash .github/scripts/tune-ci-postgres.sh
      - name: install nats-server
        env:
          NATS_SERVER_VERSION: v2.14.1
        run: |
          set -euo pipefail
          url="https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: build the example service and twin binaries
        run: |
          cargo build --locked \
            -p example-service --bin example-service \
            -p example-twin --bin example-twin
      - name: black-box battery against the built binaries
        env:
          EXAMPLE_SERVICE_BIN: ${{ github.workspace }}/target/debug/example-service
          EXAMPLE_TWIN_BIN: ${{ github.workspace }}/target/debug/example-twin
        run: |
          cargo test -p conformance-service-engine --locked \
            --test bb01_readiness_and_two_pods \
            --test bb02_mutation_gate_and_affordance \
            --test bb03_subscription_reset_and_reconnect \
            --test bb04_cross_service_cycle_twin_binary \
            --test bb05_seal_streamed_reply \
            --test bb06_session_max_age_closes_the_socket \
            --test bb07_boot_kit \
            --test bb08_reconcile_relay_cross_pod \
            --test bb09_rolling_roll_reconnect \
            --test bb10_outbox_published_once_across_pods \
            --test bb11_mirror_leader_standby_failover \
            --test bb12_serve_refuses_an_unmigrated_store \
            --test bb13_migrate_waits_for_the_app_role \
            --test bb14_migrate_needs_only_the_owner_env \
            --test bb15_migrate_refuses_an_owner_subject_to_rls \
            --test bb16_gateway_sse_subscription \
            --test bb17_paging_by_arguments_across_replicas \
            --test bb18_migrate_refuses_an_owner_dsn_the_tls_rule_rejects \
            --test bb19_sigterm_drains_and_exits_zero \
            --test s202_serve_derives_message_retention
