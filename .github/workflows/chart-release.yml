name: chart-release

# Publishes the engine's Helm library chart `br-service-engine-chart` (named
# `<library>-chart`) to oci://ghcr.io/botresources/charts and tags
# `chart/br-service-engine-chart/v<version>`. The chart continues the version
# line of `br-engine-service` (1.0.0–1.1.1, deprecated): those packages and
# their `chart/br-engine-service/v*` tags stay published as they are, and no
# path in this repository packages that name any more.

on:
  push:
    branches: [main]
    paths:
      - "charts/br-service-engine-chart/Chart.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: chart-release
  cancel-in-progress: false

env:
  CHART_NAME: br-service-engine-chart
  CHART_DIR: charts/br-service-engine-chart
  OCI_REPO: oci://ghcr.io/botresources/charts

jobs:
  release:
    name: Package and push the br-service-engine-chart library chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check the chart name matches the published name
        run: |
          set -euo pipefail
          chart_yaml="${CHART_DIR}/Chart.yaml"
          name=$(grep -m1 '^name:' "$chart_yaml" | sed -E 's/^name:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          if [ "$name" != "$CHART_NAME" ]; then
            echo "::error file=${chart_yaml}::Chart.yaml name is '${name}', this workflow publishes '${CHART_NAME}'"
            exit 1
          fi

      - name: Resolve the chart version and whether it changed
        id: ver
        run: |
          set -euo pipefail
          chart_yaml="${CHART_DIR}/Chart.yaml"
          current=$(grep -m1 '^version:' "$chart_yaml" | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          if [ -z "$current" ]; then
            echo "::error file=${chart_yaml}::could not extract the chart version"
            exit 1
          fi
          # The first push that carries the renamed chart finds no Chart.yaml at
          # this path in `before`, so it releases the version it carries.
          before="${{ github.event.before }}"
          previous=""
          if [ -n "$before" ] && git cat-file -e "${before}:${chart_yaml}" 2>/dev/null; then
            previous=$(git show "${before}:${chart_yaml}" | grep -m1 '^version:' | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          fi
          echo "version=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$previous" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "→ chart version unchanged (${current}); nothing to release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "→ chart version ${previous:-none} -> ${current}"
          fi

      - name: helm registry login
        if: steps.ver.outputs.changed == 'true'
        run: helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"

      - name: helm package and push
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          # A published chart version is immutable: a re-run (workflow_dispatch)
          # never pushes over it.
          if helm show chart "${OCI_REPO}/${CHART_NAME}" --version "$version" >/dev/null 2>&1; then
            echo "✓ ${OCI_REPO}/${CHART_NAME}:${version} is already published; not pushing it again"
            exit 0
          fi
          out=$(mktemp -d)
          helm package "$CHART_DIR" --destination "$out"
          helm push "${out}/${CHART_NAME}-${version}.tgz" "$OCI_REPO"

      - name: Tag the chart release
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          tag="chart/${CHART_NAME}/v${version}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "✓ tag ${tag} already exists"
          else
            git tag -a "${tag}" -m "${CHART_NAME} chart ${version}"
            git push origin "${tag}"
          fi
