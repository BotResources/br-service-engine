[package]
name = "example-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["board", "card", "ledger", "reply", "roster"]
board = []
card = []
ledger = []
reply = []
roster = []

[dependencies]
async-graphql = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
br-core-auth = { workspace = true }
br-core-integration = { workspace = true }
br-util-axum-readiness = { workspace = true }
br-util-postgres = { workspace = true }
chrono = { workspace = true }
example-contract = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
service-engine = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "uuid"] }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[[bin]]
name = "example-service"
path = "src/bin/service.rs"

[[bin]]
name = "example-twin"
path = "src/bin/twin.rs"
