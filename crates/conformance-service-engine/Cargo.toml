[package]
name = "conformance-service-engine"
version.workspace = true
description = "Black-box conformance battery for the BotResources service engine — TEST FIXTURE ONLY"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-graphql = { workspace = true }
async-nats = { workspace = true }
br-core-auth = { workspace = true }
bytes = { workspace = true }
br-core-integration = { workspace = true }
br-core-kernel = { workspace = true }
br-core-scope = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
rusty-s3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
service-engine = { workspace = true, features = ["test-support"] }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
br-test-harness = { git = "https://github.com/BotResources/br-e2e-harness", package = "br-test-harness", tag = "v1.2.0", version = "1.2.0", default-features = false, features = ["sse"] }
example-contract = { workspace = true }
example-service = { workspace = true }
example-twin = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
tempfile = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
