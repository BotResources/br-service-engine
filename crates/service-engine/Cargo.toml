[package]
name = "service-engine"
version.workspace = true
description = "Reactive personalized delivery and process skeleton for BotResources services"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []
# Real PostgreSQL/NATS mirror regressions run in the e2e CI job.
e2e-tests = []

[dependencies]
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
br-core-auth = { workspace = true }
br-core-integration = { workspace = true }
br-core-scope = { workspace = true }
br-scope-declaration-contract = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
rusty-s3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "dyn_compatible"
required-features = ["test-support"]

[[test]]
name = "erasure_spike"
required-features = ["test-support"]

[dev-dependencies]
br-test-harness = { git = "https://github.com/BotResources/br-e2e-harness", tag = "v1.2.0", version = "1.2.0", default-features = false, features = ["e2e-db", "nats-fabric"] }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", tag = "v1.3.0", version = "1.3.0" }
