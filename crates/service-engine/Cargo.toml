[package]
name = "service-engine"
version.workspace = true
description = "Reactive personalized delivery and process skeleton for BotResources services"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
directory = ["dep:async-trait", "dep:br-util-directory"]

[dependencies]
async-trait = { workspace = true, optional = true }
br-core-auth = { workspace = true }
br-core-integration = { workspace = true }
br-util-axum-readiness = { workspace = true }
br-util-directory = { workspace = true, features = ["consumer"], optional = true }
br-util-nats-fabric = { workspace = true, features = ["outbox"] }
bytes = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
