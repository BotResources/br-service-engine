br-core-scope = { workspace = true }
br-util-axum-readiness = { workspace = true }
br-util-nats-fabric = { workspace = true }
br-util-scope-declaration = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "dyn_compatible"
