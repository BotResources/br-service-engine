[workspace]
resolver = "3"
members = [
    "crates/service-engine",
    "crates/conformance-service-engine",
    "crates/example-contract",
    "crates/example-lib-roster",
    "crates/example-service",
    "crates/example-twin",
]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/BotResources/br-service-engine"

[workspace.dependencies]
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "v1.3.0", version = "1.3.0" }
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "v1.3.0", version = "1.3.0" }
br-core-kernel = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-kernel", tag = "v1.3.0", version = "1.3.0" }
br-core-scope = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-scope", tag = "v1.3.0", version = "1.3.0" }
br-scope-declaration-contract = { git = "https://github.com/BotResources/br-rust-common", package = "br-scope-declaration-contract", tag = "v1.3.0", version = "1.3.0" }
br-util-axum-readiness = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-axum-readiness", tag = "v1.3.0", version = "1.3.0" }
br-util-observability = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-observability", tag = "v1.3.0", version = "1.3.0" }
br-util-postgres = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-postgres", tag = "v1.3.0", version = "1.3.0" }

service-engine = { path = "crates/service-engine", version = "0.3.4" }
example-contract = { path = "crates/example-contract", version = "0.3.4" }
example-lib-roster = { path = "crates/example-lib-roster", version = "0.3.4" }
example-service = { path = "crates/example-service", version = "0.3.4" }
example-twin = { path = "crates/example-twin", version = "0.3.4" }

async-graphql = { version = "=7.0.19", features = ["uuid"] }
async-graphql-axum = "=7.0.19"
async-nats = "0.48"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
croner = "=4.0.0"
futures-channel = "0.3"
futures-util = "0.3"
hmac = "0.13"
metrics = "0.24"
mime = "0.3"
multer = "3"
pastey = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
